        <figcaption><b>17. Lịch bận của tôi</b><span class="tag">SV, GV</span><code>GET /users/me/schedule-entries</code>; thêm bằng <code>POST</code>, xóa bằng <code>DELETE /schedule-entries/{id}</code>. Nút + mở menu: nhập tay hoặc quét thời khóa biểu.
          <span class="mochy">Giờ học là khối xám, lịch hẹn là khối trắng: phân biệt bằng độ sáng, không bằng màu.</span></figcaption>

        <figcaption><b>18b. Quét thời khóa biểu: soát lại</b><span class="tag">SV, GV</span><code>POST /users/me/schedule-entries/batch</code> với <code>REPLACE</code> (thay lịch cũ) hoặc <code>MERGE</code> (gộp thêm). Nút Lưu chỉ bật khi hết dòng lỗi. Server trả <code>422</code> thì đánh dấu dòng theo <code>rowIndex</code>.
          <span class="mochy">Dòng lỗi chỉ đổi màu chữ, không có icon cảnh báo hay nền đỏ.</span></figcaption>
      </figure>

          <span class="mochy">Tin của mình là bong bóng xám sáng chữ đen (cùng màu nút chính), tin người kia là #161616. Thanh hành động là kính nổi.</span></figcaption>
