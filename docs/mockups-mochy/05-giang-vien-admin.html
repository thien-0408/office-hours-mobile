            </div>

        <figcaption><b>23. Lịch rảnh</b><span class="tag">GV</span>Rule: <code>GET/POST /lecturers/{me}/availability-rules</code>, <code>PATCH/DELETE /availability-rules/{id}</code>. Ngoại lệ: <code>/availability-exceptions</code> (<code>BLOCK</code> = Nghỉ, <code>ADD</code> = Thêm).
          <span class="mochy">Nhóm theo thứ, chỉ có chữ. Logo Zoom chỉ xuất hiện ở khung online để biết link họp là của dịch vụ nào.</span></figcaption>
      </figure>

          <div class="sb"></div>

          <span class="mochy">Lý do của sinh viên đặt trong ngoặc kép, chữ trắng, là phần đọc chính. Hai nút cùng cỡ, "Duyệt" là nút sáng.</span></figcaption>
      </figure>

          <span class="mochy">Không có icon ✨ và gradient tím cho AI: một tiêu đề chữ "Tóm tắt tự động" và một thẻ chữ thường là đủ.</span></figcaption>
