plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = "vn.edu.eiu.officehours.modules"
version = "1.0.0"

android {
  namespace "expo.modules.pdftext"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // PdfBox port for Android (PDFTextStripper with glyph positions). Maven Central.
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
